<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Feedback-pins</title>
    <style>
      :root {
        --brand: #ff5003;
        --ink: #14100c;
        --line: rgba(0, 0, 0, 0.12);
        --muted: rgba(0, 0, 0, 0.55);
        --bg: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f5f5f4;
          --line: rgba(255, 255, 255, 0.16);
          --muted: rgba(255, 255, 255, 0.6);
          --bg: #1c1917;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--ink);
        font: 400 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p.sub { margin: 0 0 14px; font-size: 12px; color: var(--muted); }
      label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 500; }
      input {
        width: 100%;
        min-height: 40px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--bg);
        color: var(--ink);
        font: 400 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255, 80, 3, 0.2); }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        min-height: 44px;
        border: 1px solid transparent;
        border-radius: 9px;
        font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
        transition: opacity 0.15s ease, background 0.15s ease;
      }
      button:hover { opacity: 0.9; }
      button:active { transform: scale(0.98); }
      button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .primary { background: var(--brand); color: #fff; }
      .ghost { background: transparent; border-color: var(--line); color: var(--ink); }
      .hint { margin: 6px 0 0; font-size: 11px; line-height: 1.4; color: var(--muted); }
      .status { margin: 12px 0 0; min-height: 18px; font-size: 12px; color: var(--muted); }
      .status[data-kind="err"] { color: #dc2626; }
      .status[data-kind="ok"] { color: #059669; }
      .recent { margin: 12px 0 0; padding: 0; list-style: none; }
      .recent li + li { margin-top: 4px; }
      .recent button {
        width: 100%;
        min-height: 34px;
        padding: 6px 8px;
        border-color: var(--line);
        background: transparent;
        color: var(--muted);
        font: 400 12px/1.3 ui-sans-serif, system-ui, sans-serif;
        text-align: left;
      }
      .recent button:hover { color: var(--ink); }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <h1>Feedback-pins</h1>
    <p class="sub">Rechtermuisknop op de pagina plaatst een pin bij de review.</p>

    <label for="project">Review (optioneel)</label>
    <input
      id="project"
      type="text"
      placeholder="Leeg = project van deze site"
      autocomplete="off"
      spellcheck="false"
    />
    <p class="hint">
      Laat leeg en de pins komen in het project van dit domein. Vul een
      review-id of review-URL in om ze aan een bestaande review te hangen.
    </p>

    <label for="key" style="margin-top: 12px">Sleutel</label>
    <input
      id="key"
      type="password"
      placeholder="PIN_KEY uit de Worker"
      autocomplete="off"
      spellcheck="false"
    />
    <p class="hint">
      Eenmalig invullen. Hij blijft in deze browser en gaat mee als bewijs dat
      jij het bent.
    </p>

    <div class="row">
      <button id="start" class="primary" type="button">Pins aanzetten</button>
      <button
        id="view"
        class="ghost"
        type="button"
        title="Alleen lezen: pins tonen zonder nieuwe te kunnen plaatsen"
      >
        Alleen lezen
      </button>
    </div>

    <p class="status" id="status" role="status"></p>
    <ul class="recent" id="recent"></ul>

    <script src="popup.js"></script>
  </body>
</html>
